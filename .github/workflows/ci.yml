name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_call:
    inputs:
      release-tag:
        type: string
        required: false
        default: ''

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    env:
      RELEASE_TAG: ${{ inputs.release-tag }}
      TEST_DATABASE_URL: postgres://kubedeploy:integration-test-only@127.0.0.1:5432/kubedeploy_test?sslmode=disable
    services:
      postgres:
        image: postgres:17.11-alpine@sha256:266d3c257594e195b309ae9d1805e54c788f1d7b375f56bf6c367aac6c917e7b
        env:
          POSTGRES_USER: kubedeploy
          POSTGRES_DB: kubedeploy_test
          POSTGRES_PASSWORD: integration-test-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U kubedeploy -d kubedeploy_test"
          --health-interval 2s --health-timeout 3s --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.27.3
          cache: false
      - name: Prepare integration database schema
        run: docker exec "${{ job.services.postgres.id }}" psql -U kubedeploy -d kubedeploy_test -c 'CREATE SCHEMA app AUTHORIZATION kubedeploy'
      - name: Test and vet
        run: |
          go test -race ./...
          go vet ./...
      - name: Build release candidate
        run: |
          docker build --tag kubedeploy-candidate:build \
            --label "org.opencontainers.image.source=https://github.com/$GITHUB_REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.version=${RELEASE_TAG:-dev}" .
      - name: Check container runtime
        run: bash scripts/test-image.sh
      - name: Install pinned Trivy
        run: bash scripts/install-trivy.sh
      - name: Reject fixable HIGH and CRITICAL vulnerabilities
        run: |
          .tools/bin/trivy image --quiet --timeout 15m --db-repository ghcr.io/aquasecurity/trivy-db:2 --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 --format json \
            --output trivy.json kubedeploy-candidate:build
      - name: Upload vulnerability report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-${{ matrix.arch }}
          path: trivy.json
          if-no-files-found: warn
          retention-days: 14
      - name: Prepare scanned candidate and SBOM
        if: inputs.release-tag != ''
        run: |
          .tools/bin/trivy image --quiet --skip-db-update --format cyclonedx \
            --output sbom.cdx.json kubedeploy-candidate:build
          docker save --output image.tar kubedeploy-candidate:build
      - name: Upload scanned candidate
        if: inputs.release-tag != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: candidate-${{ matrix.arch }}
          path: |
            image.tar
            sbom.cdx.json
            trivy.json
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
